[project]
name = "ghosttap"
version = "0.1.0"
description = "Operate an Android device from the PC via adb when the screen is black or broken."
requires-python = ">=3.12"
dependencies = ["PyQt6>=6.11"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
